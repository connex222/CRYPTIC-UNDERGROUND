name: Cryptic Underground fairness QA

on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/**'
      - 'docs/EDITORIAL-EXCEPTIONS.md'
      - '.github/workflows/cryptic-fairness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fairness:
    name: Clues, grids, daily and interaction QA
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout proposed branch
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Structural and parsing regression tests
        run: node tests/fairness.cjs
      - name: Simulated complete daily and practice runs
        run: node tests/interaction.cjs
      - name: Editorial exception triage
        run: node tests/editorial-review.cjs > editorial-review.json
      - name: Attach editorial review evidence
        uses: actions/upload-artifact@v4
        with:
          name: cryptic-underground-editorial-review
          path: editorial-review.json
          if-no-files-found: error

# This workflow only tests. It does not merge, publish, deploy or modify clue data.
